<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffdbe9);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    color: #ff4f87;
}

.container {
    width: 92%;
    max-width: 900px;
    padding: 30px;
}

h1 {
    font-size: clamp(40px, 8vw, 80px);
    margin: 0 0 20px;
    text-shadow: 0 5px 15px rgba(255, 70, 130, .2);
}

.message {
    color: #777;
    font-size: 22px;
    margin-bottom: 35px;
}

.heart {
    font-size: 100px;
    animation: beat 1s infinite;
}

.love {
    background: rgba(255,255,255,.75);
    padding: 35px;
    border-radius: 30px;
    box-shadow: 0 15px 40px rgba(255,70,130,.15);
}

button {
    margin-top: 30px;
    padding: 16px 35px;
    border: none;
    border-radius: 50px;
    background: #ff4f87;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

@keyframes beat {
    50% {
        transform: scale(1.15);
    }
}

.floating {
    position: fixed;
    font-size: 30px;
    animation: float 5s linear infinite;
}

@keyframes float {
    from {
        transform: translateY(110vh);
    }
    to {
        transform: translateY(-20vh);
    }
}
</style>
</head>

<body>

<div class="floating" style="left:10%;animation-delay:0s;">💕</div>
<div class="floating" style="left:30%;animation-delay:1s;">💗</div>
<div class="floating" style="left:55%;animation-delay:2s;">❤️</div>
<div class="floating" style="left:80%;animation-delay:3s;">💕</div>

<div class="container">
    <div class="love">

        <div class="heart">❤️</div>

        <h1>Happy Anniversary</h1>

        <div class="message">
            ขอบคุณที่อยู่ข้างกันนะ 💕
            <br><br>
            ขอให้เรามีกันแบบนี้ไปนาน ๆ
            <br>
            รักนะ ❤️
        </div>

        <button onclick="window.location.href='index.html'">
            💕 กลับหน้าหลัก
        </button>

    </div>
</div>

</body>
</html>
