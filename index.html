<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Anniversary ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffdbe9);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #ff4f87;
}

.container {
    width: 92%;
    max-width: 1100px;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: clamp(35px, 6vw, 70px);
    margin: 0 0 10px;
    color: #ff4081;
    text-shadow: 0 5px 15px rgba(255,64,129,.25);
}

.subtitle {
    color: #777;
    font-size: 18px;
    margin-bottom: 30px;
}

.main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 45px;
}

.character {
    font-size: 70px;
    animation: float 2s ease-in-out infinite alternate;
}

.character:nth-child(3) {
    animation-delay: .5s;
}

.qr-box {
    background: white;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(255,64,129,.18);
}

.qr-box img {
    width: 260px;
    height: 260px;
    display: block;
}

.qr-text {
    margin-top: 12px;
    font-weight: bold;
    color: #ff4081;
}

button {
    margin-top: 30px;
    border: none;
    background: #ff4081;
    color: white;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255,64,129,.3);
}

button:hover {
    transform: scale(1.05);
}

.heart {
    position: fixed;
    font-size: 25px;
    animation: fall linear infinite;
    opacity: .7;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-15px); }
}

@keyframes fall {
    from {
        transform: translateY(-100px);
    }
    to {
        transform: translateY(110vh);
    }
}

@media (max-width: 700px) {
    .main {
        gap: 10px;
    }

    .character {
        font-size: 45px;
    }

    .qr-box img {
        width: 210px;
        height: 210px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Happy Anniversary ❤️</h1>

    <div class="subtitle">
        ขอบคุณที่อยู่ข้างกันนะ 💕
    </div>

    <div class="main">

        <div class="character">
            👨‍❤️‍👨
        </div>

        <div class="qr-box">

            <!-- QR CODE -->
            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fjaomanxx01.github.io%2Fhappy-anniversary%2Fsecond.html"
                alt="Happy Anniversary QR Code"
            >

            <div class="qr-text">
                📱 สแกน QR เพื่อเปิด 💕
            </div>

        </div>

        <div class="character">
            👨‍❤️‍👨
        </div>

    </div>

    <button onclick="window.location.href='second.html'">
        💕 Open Happy Anniversary
    </button>

</div>

<script>

function  {
    window.location.href =
        "https://jaomanxx01.github.io/happy-anniversary/";
}

for (let i = 0; i < 20; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    heart.style.animationDelay =
        Math.random() * 5 + "s";

    document.body.appendChild(heart);
}

</script>

</body>
</html>
