<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Anniversary ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffdbe9);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #ff4f87;
}

.container {
    width: 92%;
    max-width: 1100px;
    text-align: center;
    padding: 30px;
}

h1 {
    font-size: clamp(35px, 6vw, 70px);
    margin: 0 0 10px;
    color: #ff4f87;
    text-shadow: 0 4px 15px rgba(255, 79, 135, .25);
}

.subtitle {
    font-size: 20px;
    color: #777;
    margin-bottom: 35px;
}

.love-box {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
}

.character {
    width: 220px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 130px;
    animation: float 3s ease-in-out infinite;
}

.character.right {
    animation-delay: 1.5s;
}

.qr-area {
    background: white;
    padding: 22px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(255, 70, 130, .2);
}

.qr-area img {
    width: 230px;
    height: 230px;
    display: block;
}

.qr-text {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

button {
    margin-top: 30px;
    border: none;
    background: #ff4f87;
    color: white;
    padding: 15px 32px;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 79, 135, .3);
    transition: .25s;
}

button:hover {
    transform: scale(1.08);
    background: #ff3274;
}

.heart {
    position: fixed;
    font-size: 25px;
    animation: fall linear infinite;
    opacity: .7;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

@keyframes fall {
    0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

@media (max-width: 700px) {
    .love-box {
        gap: 5px;
    }

    .character {
        width: 70px;
        font-size: 55px;
    }

    .qr-area img {
        width: 170px;
        height: 170px;
    }

    .qr-area {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Happy Anniversary ❤️</h1>

    <div class="subtitle">
        ขอบคุณที่อยู่ข้างกันนะ 💕
    </div>

    <div class="love-box">

        <!-- ตัวละครฝั่งซ้าย -->
        <div class="character">
            🧑🏻‍❤️‍🧑🏻
        </div>

        <!-- QR CODE -->
        <div class="qr-area">

            <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fjaomanxx01.github.io%2Fhappy-anniversary%2F"
                alt="Happy Anniversary QR Code"
            >

            <div class="qr-text">
                📱 สแกน QR เพื่อเปิด 💕
            </div>

        </div>

        <!-- ตัวละครฝั่งขวา -->
        <div class="character right">
            🧑🏻‍❤️‍🧑🏻
        </div>

    </div>

    <button onclick="openAnniversary()">
        💖 Open Happy Anniversary
    </button>

</div>

<script>

function openAnniversary() {
    window.location.href =
        "https://jaomanxx01.github.io/happy-anniversary/";
}

/* หัวใจตก */
for (let i = 0; i < 20; i++) {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    heart.style.animationDelay =
        Math.random() * 5 + "s";

    document.body.appendChild(heart);
}

</script>

</body>
</html>
