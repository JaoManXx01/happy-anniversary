<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Anniversary ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,255,255,.8) 0 4px, transparent 5px),
    radial-gradient(circle at 90% 20%, rgba(255,255,255,.8) 0 4px, transparent 5px),
    linear-gradient(135deg, #ffc4d8, #fff0f6, #ffd6e5);
  background-size: 180px 180px, 220px 220px, cover;
  color: #e91e63;
  text-align: center;
  overflow-x: hidden;
  padding: 30px 15px;
}

.container {
  width: min(950px, 100%);
  margin: auto;
}

h1 {
  margin: 10px 0 0;
  font-size: clamp(42px, 8vw, 90px);
  font-weight: 900;
  color: #e91e4d;
  text-shadow:
    4px 4px 0 white,
    7px 7px 0 rgba(180, 40, 80, .25);
}

.subtitle {
  font-size: clamp(25px, 5vw, 55px);
  font-weight: 900;
  color: #ff3d72;
  text-shadow: 3px 3px white;
  margin-bottom: 15px;
}

.ribbon {
  display: inline-block;
  background: #f83d68;
  color: white;
  font-size: clamp(20px, 4vw, 38px);
  font-weight: bold;
  padding: 15px 55px;
  border-radius: 10px;
  box-shadow: 0 7px 0 #d92d56;
  margin-bottom: 25px;
}

.label {
  font-size: clamp(25px, 5vw, 45px);
  font-weight: bold;
  color: #f13b68;
  margin-bottom: 8px;
}

.counter-box {
  background: rgba(255,255,255,.75);
  border: 3px solid #ff7c9d;
  border-radius: 35px;
  padding: 25px 15px;
  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.7),
    0 10px 25px rgba(255, 70, 120, .15);
  margin-bottom: 25px;
}

.counter {
  font-size: clamp(25px, 5vw, 48px);
  font-weight: bold;
  color: #e93465;
  line-height: 1.4;
}

.photo-frame {
  background: white;
  padding: 12px;
  border-radius: 45px;
  border: 4px solid #ff9db5;
  box-shadow: 0 10px 35px rgba(255, 60, 110, .25);
}

.photo-frame img {
  display: block;
  width: 100%;
  max-height: 650px;
  object-fit: cover;
  border-radius: 35px;
}

.date {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 30px;
  border-radius: 35px;
  background: #f83d68;
  color: white;
  font-size: clamp(18px, 3vw, 30px);
  font-weight: bold;
  box-shadow: 0 5px 0 #d92d56;
}

.message {
  background: rgba(255,255,255,.8);
  border: 3px solid #ff9db5;
  border-radius: 30px;
  padding: 25px;
  margin-top: 25px;
  font-size: clamp(18px, 3vw, 28px);
  color: #4b252d;
  line-height: 1.8;
}

.heart {
  position: fixed;
  font-size: 30px;
  animation: float 5s linear infinite;
  opacity: .8;
  pointer-events: none;
}

@keyframes float {
  0% {
    transform: translateY(110vh) rotate(0deg);
  }

  100% {
    transform: translateY(-20vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<div class="heart" style="left:5%; animation-delay:0s;">❤️</div>
<div class="heart" style="left:20%; animation-delay:2s;">💕</div>
<div class="heart" style="left:80%; animation-delay:1s;">💗</div>
<div class="heart" style="left:92%; animation-delay:3s;">❤️</div>

<div class="container">

  <h1>Happy Anniversary ❤️</h1>

  <div class="subtitle">
    นะคะที่รัก
  </div>

  <div class="ribbon">
    ♥ เราครบกันมาแล้ว ♥
  </div>

  <div class="label">
    เวลาผ่านไป
  </div>

  <div class="counter-box">
    <div id="counter" class="counter">
      กำลังคำนวณเวลา...
    </div>
  </div>

  <div class="photo-frame">
    <img src="couple.jpg" alt="รูปของเรา">
  </div>

  <div class="date">
    ♥ ตั้งแต่วันที่ 23 เมษายน 2025 ♥
  </div>

  <div class="message">
    ขอบคุณที่เข้ามาเป็นความสุขในทุก ๆ วันนะคะ<br>
    อยู่ด้วยกันไปนาน ๆ เลยน้าาา ❤️
  </div>

</div>

<script>
const startDate = new Date("2025-04-23T00:00:00+07:00");

function updateCounter() {
  const now = new Date();
  let diff = now - startDate;

  if (diff < 0) {
    document.getElementById("counter").textContent =
      "ยังไม่ถึงวันเริ่มต้น ❤️";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  document.getElementById("counter").textContent =
    `${days} วัน ${String(hours).padStart(2, "0")} ชั่วโมง ` +
    `${String(minutes).padStart(2, "0")} นาที ` +
    `${String(seconds).padStart(2, "0")} วินาที`;
}

updateCounter();
setInterval(updateCounter, 1000);
</script>

</body>
</html>
